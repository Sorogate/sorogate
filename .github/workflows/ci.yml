name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deployed-contract check compares with the commit the public deployment was built from.
          fetch-depth: 0
      # Contracts built with soroban-sdk 28 must be built with `stellar contract build`.
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          # This action installs the CLI version named by the ref it is called with. A commit hash names no version, so the
          # version is given here. When Dependabot moves the pin above, move this to the same release.
          version: 28.1.0
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: stellar contract build

      # Random differential test: the TypeScript model generates policies and the answers it expects, and the
      # real contract must agree on every one. A failing seed is printed, so it can be reproduced with
      # `npm run generate:random -w @sorogate/sdk -- --seed <seed> --count 1000 --out <dir>`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The built contract against the public Testnet deployment
        run: npm run check:deployed-wasm -w @sorogate/sdk -- --wasm ../../target/wasm32v1-none/release/access_policy.wasm --record ../../docs/deployments/testnet.json
      - name: Contract against TypeScript model, random policies
        run: |
          for seed in 1 2 3 "${{ github.run_number }}"; do
            echo "::group::seed $seed"
            npm run generate:random -w @sorogate/sdk -- --seed "$seed" --count 1000 --out "$RUNNER_TEMP/random-$seed"
            SOROGATE_RANDOM_VECTORS="$RUNNER_TEMP/random-$seed" cargo test -p access-policy --test vectors random
            echo "::endgroup::"
          done

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The packed SDK installs and imports in an empty project
        run: bash scripts/check-pack.sh

  # The oldest Node the documentation claims (README, CONTRIBUTING, `engines`): 22.12.0, which is what the SDK's dependencies
  # declare. A job of its own, so that the required checks `contracts` and `sdk` keep their names.
  sdk-minimum-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The packed SDK installs and imports in an empty project
        run: bash scripts/check-pack.sh
