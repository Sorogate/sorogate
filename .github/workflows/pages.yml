name: Pages

# Publishes the playground in packages/site to GitHub Pages. It runs when something the page is built from changes on
# main, or by hand. Pull requests are not built here: the CI workflow already tests and builds the site for them.
on:
  push:
    branches: [main]
    paths:
      - 'packages/site/**'
      - 'packages/sdk/src/**'
      - 'spec/vectors/evaluate.json'
      - 'docs/deployments/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# One deployment at a time; a later one waits instead of cancelling one that is half way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The page's examples are the shared vectors; do not publish a build whose examples no longer match them.
      - run: npm test -w @sorogate/site
      - run: npm run build -w @sorogate/site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
