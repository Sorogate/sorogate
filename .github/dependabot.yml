version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # soroban-sdk is bumped deliberately: a new major can change contract behavior and the build tooling.
      - dependency-name: soroban-sdk
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint does not yet accept TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Astro 7.4 refuses to build on Node older than 22.23.4, and the documented minimum is 22.22.2 (engines, README,
      # CONTRIBUTING). Patch releases of 7.3 still arrive. Move the minimum and take Astro 7.4 together, on purpose. This
      # ignore may also hold back a security fix that exists only in a newer Astro, so do not rely on Dependabot for that:
      # the weekly Audit job (npm audit, high and above) and the repository's security alerts report it.
      - dependency-name: astro
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
